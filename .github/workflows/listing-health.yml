name: Listing health check
on:
  schedule: [{ cron: '17 6 * * 1' }]   # Mondays 06:17 UTC
  workflow_dispatch:
permissions: { issues: write, contents: read }
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - id: run
        run: node scripts/check-listings.mjs || true
        env:
          SUPABASE_URL: https://fdlzvjdseljajjkdmdbv.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      - name: Open/refresh issue on failures
        if: steps.run.outputs.failures != '0'
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          n=$(gh issue list --label listing-health --state open --json number --jq '.[0].number')
          if [ -z "$n" ]; then gh issue create --title "Listing health: broken image/listing URLs" --label listing-health --body-file health-report.md
          else gh issue edit "$n" --body-file health-report.md; gh issue comment "$n" --body "Re-checked $(date -u +%F): still failing."; fi
